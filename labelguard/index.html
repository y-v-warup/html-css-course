<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabelGuard AI — Live Camera Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f1ff;font-family:Inter,system-ui,Arial}
header{padding:14px 18px;border-bottom:1px solid #182a40;background:#081321}header b{font-size:19px;color:#7dd3fc}
main{max-width:980px;margin:auto;padding:16px;display:grid;grid-template-columns:1.35fr .9fr;gap:14px}
.card{background:#0d1b2e;border:1px solid #20334d;border-radius:18px;padding:14px;box-shadow:0 8px 28px #0003}
.camera{position:relative;aspect-ratio:4/3;background:#02060b;border-radius:13px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:8%;top:14%;width:84%;height:72%;border:2px solid #7dd3fc;border-radius:14px;box-shadow:0 0 0 9999px #0003}
.line{position:absolute;left:8%;width:84%;height:2px;background:#7dd3fc;animation:scan 2s linear infinite}
@keyframes scan{0%{top:14%}50%{top:86%}100%{top:14%}}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:10px 14px;background:#1683c5;color:white;font-weight:700;cursor:pointer}button.secondary{background:#20334d}button.danger{background:#8d2c3c}
.status{font-size:13px;color:#9fb2c9;margin-top:10px}
.result{font-size:25px;font-weight:800;padding:15px;border-radius:12px;background:#14253b;margin-bottom:14px}
.ok{color:#55e6a5}.review{color:#ffd166}.bad{color:#ff758f}
table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid #20334d}td:first-child{color:#91a7c0;width:45%}
#raw{white-space:pre-wrap;max-height:180px;overflow:auto;color:#b9c9da;font-size:12px;background:#07111f;padding:10px;border-radius:10px}
small{color:#7187a0}
@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}}
</style>
</head>
<body>
<header><b>LABELGUARD AI</b> <small>REAL CAMERA • OCR • DECLARATION RULE ENGINE</small></header>
<main>
<section class="card">
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="frame"></div><div class="line"></div></div>
<div class="controls"><button id="start">Start Camera</button><button id="scan">Scan Label</button><button id="auto" class="secondary">Auto Scan: OFF</button><button id="stop" class="danger">Stop</button></div>
<div id="status" class="status">Camera stopped. Press Start Camera.</div>
<canvas id="canvas" hidden></canvas>
</section>
<section class="card">
<div id="result" class="result">READY TO SCAN</div>
<div id="coverage">Declaration coverage: —</div>
<table id="fields"></table>
<h4>Raw OCR</h4><div id="raw">No scan yet.</div>
<p><small>Scope: declaration checking only. This demo does not physically measure weight/volume or verify legal authenticity.</small></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script>
const v=document.getElementById('video'), c=document.getElementById('canvas'), statusEl=document.getElementById('status');
let stream=null, worker=null, busy=false, auto=false, timer=null;
const setStatus=x=>statusEl.textContent=x;
async function start(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream; await v.play(); setStatus('Camera live — place the package label inside the blue frame.');
 }catch(e){setStatus('Camera error: '+e.message+'. Use HTTPS/localhost and allow camera permission.');}
}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;clearInterval(timer);timer=null;auto=false;document.getElementById('auto').textContent='Auto Scan: OFF';setStatus('Camera stopped.')}
function crop(){
 const w=v.videoWidth,h=v.videoHeight,x=w*.08,y=h*.14,cw=w*.84,ch=h*.72;
 c.width=Math.round(cw*1.5);c.height=Math.round(ch*1.5);
 const ctx=c.getContext('2d');ctx.drawImage(v,x,y,cw,ch,0,0,c.width,c.height);
 const img=ctx.getImageData(0,0,c.width,c.height);
 for(let i=0;i<img.data.length;i+=4){const g=.299*img.data[i]+.587*img.data[i+1]+.114*img.data[i+2];const z=Math.max(0,Math.min(255,(g-128)*1.65+128));img.data[i]=img.data[i+1]=img.data[i+2]=z}
 ctx.putImageData(img,0,0);return c;
}
function parse(t){
 const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean), s=t.replace(/[|]/g,'I').replace(/\s+/g,' ');
 let product='';
 for(const x of lines.slice(0,12)){
   if(x.length>2 && !/(mrp|maximum|retail|net|qty|quantity|manufactur|packed|marketed|consumer|customer|care|helpline|india|origin|batch|date|expiry|exp\b|mfd\b|fssai|barcode)/i.test(x)){product=x;break}
 }
 const find=(patterns)=>{for(const r of patterns){const m=s.match(r);if(m)return (m[0]||'').trim()}return ''};
 const qty=find([
  /(?:net\s*(?:qty|quantity)|qty|quantity)\s*[:\-]?\s*\d+(?:\.\d+)?\s*(?:kg|g|mg|l|ml|pcs?|litre|liter)\b/i,
  /\b\d+(?:\.\d+)?\s*(?:kg|g|mg|l|ml)\b/i
 ]);
 const mrp=find([
  /(?:m\s*\.?\s*r\s*\.?\s*p\s*\.?|maximum\s*retail\s*price)\s*(?:rs\.?|inr|₹)?\s*[:\-]?\s*(?:₹|rs\.?|inr)?\s*\d+(?:[,.]\d{1,2})?\s*(?:\/-)?/i,
  /(?:rs\.?|₹|inr)\s*\d+(?:[,.]\d{1,2})?\s*(?:\/-)?/i
 ]);
 const man=find([
  /(?:manufactured\s*by|manufactured\s*&\s*marketed\s*by|marketed\s*by|packed\s*by|manufactured\s*&\s*packed\s*by|manufacturer|packer)\s*[:\-]?\s*[^\n]+/i
 ]);
 const care=find([
  /(?:consumer\s*care|customer\s*care|consumer\s*complaints|helpline|toll[- ]?free|contact\s*us)\s*[:\-]?\s*[^\n]+/i,
  /(?:\+?91[\s-]?)?\d{3,5}[\s-]?\d{3,5}[\s-]?\d{3,5}/
 ]);
 const origin=find([/(?:country\s*of\s*origin|made\s*in|product\s*of)\s*[:\-]?\s*[^\n]+/i]);
 const batch=find([/(?:batch|lot)\s*(?:no|number)?\s*[:\-]?\s*[A-Z0-9\-\/]+/i]);
 const dates=find([/(?:mfd|manufactured\s*on|packed\s*on|date\s*of\s*(?:manufacture|packing))\s*[:\-]?\s*[^\n]+/i]);
 const expiry=find([/(?:use\s*by|best\s*before|expiry|exp\.?|use\s*before)\s*[:\-]?\s*[^\n]+/i]);
 return {product,net_quantity:qty,mrp,manufacturer:man,consumer_care:care,country_of_origin:origin,batch:batch,manufacturing_date:dates,expiry:expiry};
}!doctype html>

<body>
<header><b>LABELGUARD AI</b> <small>REAL CAMERA • OCR • DECLARATION RULE ENGINE</small></header>
<main>
<section class="card">
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="frame"></div><div class="line"></div></div>
<div class="controls"><button id="start">Start Camera</button><button id="scan">Scan Label</button><button id="auto" class="secondary">Auto Scan: OFF</button><button id="stop" class="danger">Stop</button></div>
<div id="status" class="status">Camera stopped. Press Start Camera.</div>
<canvas id="canvas" hidden></canvas>
</section>
<section class="card">
<div id="result" class="result">READY TO SCAN</div>
<div id="coverage">Declaration coverage: —</div>
<table id="fields"></table>
<h4>Raw OCR</h4><div id="raw">No scan yet.</div>
<p><small>Scope: declaration checking only. This demo does not physically measure weight/volume or verify legal authenticity.</small></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script>
const v=document.getElementById('video'), c=document.getElementById('canvas'), statusEl=document.getElementById('status');
let stream=null, worker=null, busy=false, auto=false, timer=null;
const setStatus=x=>statusEl.textContent=x;
async function start(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream; await v.play(); setStatus('Camera live — place the package label inside the blue frame.');
 }catch(e){setStatus('Camera error: '+e.message+'. Use HTTPS/localhost and allow camera permission.');}
}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;clearInterval(timer);timer=null;auto=false;document.getElementById('auto').textContent='Auto Scan: OFF';setStatus('Camera stopped.')}
function crop(){
 const w=v.videoWidth,h=v.videoHeight,x=w*.08,y=h*.14,cw=w*.84,ch=h*.72;
 c.width=Math.round(cw*1.5);c.height=Math.round(ch*1.5);
 const ctx=c.getContext('2d');ctx.drawImage(v,x,y,cw,ch,0,0,c.width,c.height);
 const img=ctx.getImageData(0,0,c.width,c.height);
 for(let i=0;i<img.data.length;i+=4){const g=.299*img.data[i]+.587*img.data[i+1]+.114*img.data[i+2];const z=Math.max(0,Math.min(255,(g-128)*1.35+128));img.data[i]=img.data[i+1]=img.data[i+2]=z}
 ctx.putImageData(img,0,0);return c;
}
function parse(t){
 const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean), s=t.replace(/\s+/g,' ');
 let product='';
 for(const x of lines.slice(0,8))if(x.length>2&&!/(mrp|maximum retail|net|qty|quantity|manufactur|packed|consumer|care|india|origin)/i.test(x)){product=x;break}
 const m=(r)=>{const x=s.match(r);return x?x[0]:''};
 const qty=m(/(?:net\s*(?:qty|quantity)?|qty|quantity)\s*[:\-]?\s*\d+(?:\.\d+)?\s*(?:kg|g|mg|l|ml|pcs?|litre|liter)\b/i)||m(/\b\d+(?:\.\d+)?\s*(?:kg|g|mg|l|ml)\b/i);
 const mrp=m(/(?:mrp|maximum\s*retail\s*price)\s*[:\-]?\s*(?:rs\.?|₹)?\s*\d+(?:\.\d+)?/i);
 const man=m(/(?:manufactured\s*by|manufactured\s*&\s*marketed\s*by|marketed\s*by|packed\s*by|manufacturer|packer)\s*[:\-]?\s*[^\n]+/i);
 const care=m(/(?:consumer\s*care|customer\s*care|helpline|toll[- ]?free|contact\s*us)\s*[:\-]?\s*[^\n]+/i);
 const origin=m(/(?:country\s*of\s*origin|made\s*in|product\s*of)\s*[:\-]?\s*[^\n]+/i);
 return {product,net_quantity:qty,mrp,manufacturer:man,consumer_care:care,country_of_origin:origin};
}
async function scan(){
 if(busy||!stream||v.readyState<2)return;
 busy=true;setStatus('Capturing label → OCR → checking declarations…');
 try{
  const img=crop();
  if(!worker)worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status)setStatus(m.status+' '+Math.round((m.progress||0)*100)+'%')}});
  const {data}=await worker.recognize(img);
  const f=parse(data.text), keys=Object.keys(f), found=keys.filter(k=>f[k]).length, pct=Math.round(found/keys.length*100);
  const missing=keys.filter(k=>!f[k]);
  let st=pct>=85?'DECLARATIONS OK':pct>=50?'REVIEW REQUIRED':'NON-COMPLIANT';
  document.getElementById('result').textContent=st;document.getElementById('result').className='result '+(pct>=85?'ok':pct>=50?'review':'bad');
  document.getElementById('coverage').textContent='Declaration coverage: '+pct+'% • '+found+'/'+keys.length+' fields found';
  document.getElementById('fields').innerHTML=keys.map(k=>'<tr><td>'+k.replaceAll('_',' ')+'</td><td>'+ (f[k]||'NOT FOUND')+'</td></tr>').join('');
  document.getElementById('raw').textContent=data.text||'No readable text detected.';
  setStatus('Scan complete. Hold the package steady for a clearer result.');
 }catch(e){setStatus('OCR error: '+e.message)}finally{busy=false}
}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;document.getElementById('scan').onclick=scan;
document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent='Auto Scan: '+(auto?'ON':'OFF');if(auto){scan();timer=setInterval(scan,3500)}else{clearInterval(timer);timer=null}};
</script>
