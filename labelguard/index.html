<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabelGuard AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px 20px;background:#fff;border-bottom:1px solid #e7ebf1;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}header span{font-size:12px;color:#7a8597}
main{max-width:1050px;margin:auto;padding:16px;display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.card{background:#fff;border:1px solid #e7ebf1;border-radius:16px;padding:14px;box-shadow:0 5px 18px #1820330a}
.camera{position:relative;aspect-ratio:4/3;background:#111;border-radius:12px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:10%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px #0004}
.scanline{position:absolute;left:10%;width:80%;height:2px;background:#55b7ff;animation:s 2s linear infinite}@keyframes s{0%{top:10%}50%{top:90%}100%{top:10%}}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}button{border:0;border-radius:9px;padding:10px 13px;background:#172033;color:#fff;font-weight:700}button.alt{background:#edf2f7;color:#263247}button:disabled{opacity:.45}
.status{font-size:13px;color:#697589;margin-top:9px;min-height:20px}.thumbs{display:flex;gap:8px;margin-top:10px}.thumb{width:100px;height:75px;object-fit:cover;border-radius:8px;background:#edf2f7}
.result{padding:12px;border-radius:11px;background:#f1f4f8;font-weight:800;margin-bottom:12px}.ok{color:#16824b;background:#eaf8f1}.review{color:#996b00;background:#fff7dd}.bad{color:#b52b45;background:#fff0f3}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px 3px;border-bottom:1px solid #edf0f4;vertical-align:top}td:first-child{color:#768197;width:43%}
#qr{font-size:12px;color:#596579;background:#f6f8fb;border-radius:8px;padding:9px;margin-top:10px;word-break:break-all;max-height:90px;overflow:auto}
small{color:#8a94a5}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}}
</style></head>
<body>
<header><b>LABELGUARD AI</b><span>AI VISION • OCR • QR • RULE ENGINE</span></header>
<main>
<section class="card">
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="frame"></div><div class="scanline"></div></div>
<div class="controls">
<button id="start">Start camera</button><button id="front" class="alt" disabled>Capture front</button>
<button id="back" class="alt" disabled>Capture back + QR</button><button id="analyze" disabled>Analyze</button><button id="stop" class="alt">Stop</button>
</div>
<div id="status" class="status">Start the camera and keep the package inside the frame.</div>
<div class="thumbs"><img id="fthumb" class="thumb" alt=""><img id="bthumb" class="thumb" alt=""></div>
<div id="qr">QR: not detected</div>
<canvas id="canvas" hidden></canvas>
</section>
<section class="card">
<div id="result" class="result">READY</div>
<div id="coverage">Declaration coverage: —</div>
<table id="fields"></table>
<p><small>Declaration checking only. The system does not physically measure weight/volume or establish legal authenticity.</small></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const v=document.getElementById('video'),c=document.getElementById('canvas'),statusEl=document.getElementById('status');
const frontBtn=document.getElementById('front'),backBtn=document.getElementById('back'),analyzeBtn=document.getElementById('analyze');
let stream=null,frontImage='',backImage='',qrData='',qrTimer=null,busy=false;
const status=x=>statusEl.textContent=x;
function frameData(){const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return '';c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return c.toDataURL('image/jpeg',.86)}
function startQR(){clearInterval(qrTimer);qrTimer=setInterval(()=>{if(!stream||v.readyState<2||busy)return;const w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(v,0,0,w,h);const d=ctx.getImageData(0,0,w,h);const code=window.jsQR?jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'}):null;if(code){qrData=code.data;document.getElementById('qr').textContent='QR detected: '+qrData;status('QR detected. Capture the back label to include it in analysis.');}},700)}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:960}},audio:false});v.srcObject=stream;await v.play();frontBtn.disabled=backBtn.disabled=false;status('Camera live. Capture the FRONT label first.');startQR()}catch(e){status('Camera error: '+e.message+'. Use HTTPS and allow camera access.')}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;clearInterval(qrTimer);qrTimer=null;frontBtn.disabled=backBtn.disabled=true;status('Camera stopped.')}
frontBtn.onclick=()=>{frontImage=frameData();document.getElementById('fthumb').src=frontImage;analyzeBtn.disabled=false;status('Front captured. Turn the package around and capture the BACK.')}
backBtn.onclick=()=>{backImage=frameData();document.getElementById('bthumb').src=backImage;analyzeBtn.disabled=!frontImage;status(qrData?'Back captured + QR found. Ready to analyze.':'Back captured. Ready to analyze; QR was not detected.')}
async function analyze(){if(!frontImage||busy)return;busy=true;analyzeBtn.disabled=true;status('Sending front + back + QR to AI vision…');try{
 const r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({front_image:frontImage,back_image:backImage||null,qr_data:qrData||null})});
 const d=await r.json();if(!r.ok)throw new Error(d.detail||'Server error');
 const cls=d.status==='DECLARATIONS OK'?'ok':d.status==='REVIEW REQUIRED'?'review':'bad';
 const result=document.getElementById('result');result.textContent=d.status;result.className='result '+cls;
 document.getElementById('coverage').textContent='Declaration coverage: '+d.coverage+'% • '+d.found_fields+'/'+d.checked_fields+' fields found';
 const rows={product_name:'Product',net_quantity:'Net quantity',mrp:'MRP',manufacturer:'Manufacturer',consumer_care:'Consumer care',country_of_origin:'Country of origin',batch_lot:'Batch / Lot',manufacturing_date:'Manufacturing date',expiry_best_before:'Expiry / Best before',fssai:'FSSAI',barcode_or_gtin:'Barcode / GTIN',qr_details:'QR details'};
 document.getElementById('fields').innerHTML=Object.entries(rows).map(([k,l])=>'<tr><td>'+l+'</td><td>'+(d[k]||'NOT FOUND')+'</td></tr>').join('');
 status('AI analysis complete.');}catch(e){status('Analysis failed: '+e.message)}finally{busy=false;analyzeBtn.disabled=false}}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;frontBtn.onclick=frontBtn.onclick;analyzeBtn.onclick=analyze;
</script></body></html>
